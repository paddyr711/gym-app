<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Gym Tracker</title>
<meta name="theme-color" content="#121316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Home Gym">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* ============================================================
   Material Design 3 — dark scheme
   Source colour: chalk amber (#F2C043) over iron-blue neutrals.
   Secondary accents are Olympic plate colours (25/20/15/10 kg).
   ============================================================ */
:root{
  --primary:#F5C543; --on-primary:#3D2E00; --primary-container:#584300; --on-primary-container:#FFE08A;
  --secondary:#D5C5A1; --on-secondary:#392F15; --secondary-container:#50452A; --on-secondary-container:#F2E1BC;
  --surface:#121316; --on-surface:#E4E2E4;
  --surface-container-lowest:#0C0E10; --surface-container-low:#1A1C1F; --surface-container:#1E2023;
  --surface-container-high:#282A2E; --surface-container-highest:#333539;
  --on-surface-variant:#A9A8AD; --outline:#6F6E73; --outline-variant:#3A3B3F;
  --error:#FFB4AB; --success:#8ED99C;
  --scrim:rgba(0,0,0,.62);
  /* Olympic plate colours — used for weight coding */
  --plate-25:#D8483F; --plate-20:#3F72D8; --plate-15:#E0B12A; --plate-10:#4FA96B; --plate-0:#8A8A8E;
  --tap:44px;
  --r-xs:8px; --r-s:12px; --r-m:16px; --r-l:22px; --r-xl:28px;
  --nav-h:calc(64px + env(safe-area-inset-bottom));
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--surface); color:var(--on-surface);
  font-family:var(--font); font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ---------- Type roles ---------- */
.eyebrow{
  font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--on-surface-variant);
}
.display{font-size:26px;line-height:1.15;font-weight:750;letter-spacing:-.02em;margin:2px 0 0}
.title{font-size:16px;font-weight:650;letter-spacing:-.01em;margin:0}
.body-s{font-size:13px;color:var(--on-surface-variant);margin:0}

/* ---------- Icons ---------- */
.ic{width:22px;height:22px;flex:none;display:block;pointer-events:none}
.ic path,.ic circle,.ic line{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic .dot{stroke-width:2.6}
#sprite{display:none}

/* ---------- App frame ---------- */
.app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header.top{
  position:sticky;top:0;z-index:20;
  padding:calc(14px + env(safe-area-inset-top)) 16px 12px;
  background:linear-gradient(var(--surface) 72%,rgba(18,19,22,0));
  display:flex;align-items:flex-start;gap:12px;
}
header.top .grow{min-width:0;flex:1}
.icon-btn{
  width:var(--tap);height:var(--tap);border-radius:50%;
  display:grid;place-items:center;color:var(--on-surface-variant);
}
.icon-btn:hover{background:var(--surface-container-high);color:var(--on-surface)}
main{flex:1;padding:0 16px calc(var(--nav-h) + 28px)}
.view[hidden]{display:none}

/* ---------- Bottom navigation ---------- */
nav.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--surface-container);border-top:1px solid var(--outline-variant);
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;justify-content:center;gap:4px;
}
nav.bottom .tab{
  flex:1;max-width:150px;min-height:64px;padding:8px 0 10px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--on-surface-variant);font-size:11px;font-weight:650;letter-spacing:.04em;
}
nav.bottom .tab .pill{
  width:56px;height:30px;border-radius:16px;display:grid;place-items:center;
  transition:background .18s ease,color .18s ease;
}
nav.bottom .tab[aria-selected="true"]{color:var(--on-surface)}
nav.bottom .tab[aria-selected="true"] .pill{background:var(--primary-container);color:var(--on-primary-container)}

/* ---------- Day switcher ---------- */
.days{display:flex;gap:8px;margin:4px 0 16px}
.day-chip{
  flex:1;min-height:var(--tap);padding:7px 8px;border-radius:var(--r-s);
  border:1px solid var(--outline-variant);background:var(--surface-container-low);
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;
  color:var(--on-surface-variant);text-align:left;
}
.day-chip b{font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--on-surface)}
.day-chip span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-chip[aria-pressed="true"]{background:var(--primary-container);border-color:transparent;color:var(--on-primary-container)}
.day-chip[aria-pressed="true"] b{color:var(--on-primary-container)}

/* ---------- Signature: the loading bar ---------- */
.rail{
  background:var(--surface-container-low);border:1px solid var(--outline-variant);
  border-radius:var(--r-m);padding:14px 16px 16px;margin-bottom:20px;
}
.rail-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.rail-head .big{font-size:22px;font-weight:750;letter-spacing:-.02em}
.rail-head .big small{font-size:13px;font-weight:600;color:var(--on-surface-variant);letter-spacing:0}
.bar{display:flex;gap:3px;height:10px}
.bar .seg{flex:var(--w,1);background:var(--surface-container-highest);border-radius:99px;overflow:hidden;position:relative}
.bar .seg i{
  position:absolute;inset:0 auto 0 0;width:var(--f,0%);
  background:var(--c,var(--primary));border-radius:99px;
  transition:width .35s cubic-bezier(.2,0,0,1);
}
.rail-legend{display:flex;gap:3px;margin-top:7px}
.rail-legend span{flex:var(--w,1);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--on-surface-variant);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* ---------- Phase sections ---------- */
.phase{margin:0 0 8px;display:flex;align-items:center;gap:10px}
.phase .idx{
  font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--on-surface-variant);
  background:var(--surface-container-high);border-radius:6px;padding:2px 6px;
}
.phase .name{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--phase-c,var(--on-surface-variant))}
.phase .rule{flex:1;height:1px;background:var(--outline-variant)}
.phase-group{margin-bottom:26px}

/* ---------- Exercise card ---------- */
.card{
  background:var(--surface-container);border-radius:var(--r-m);
  padding:14px 14px 8px;margin-bottom:10px;
  border-left:3px solid var(--phase-c,var(--outline-variant));
}
.card.done{border-left-color:var(--success)}
.card-head{display:flex;align-items:flex-start;gap:8px}
.card-head .grow{flex:1;min-width:0}
.card h3{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em}
.card .meta{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--on-surface-variant);margin-top:3px}
.note{
  margin:10px 0 2px;padding:8px 10px;border-radius:var(--r-xs);
  background:var(--surface-container-low);border:1px dashed var(--outline-variant);
  font-size:13px;color:var(--secondary);
}
.sets{margin-top:10px}
.set-row{display:flex;align-items:center;gap:8px;padding:4px 0}
.set-no{
  width:26px;flex:none;font-size:11px;font-weight:700;letter-spacing:.06em;
  color:var(--on-surface-variant);display:flex;align-items:center;gap:5px;
}
.plate{width:6px;height:6px;border-radius:50%;background:var(--plate-0);flex:none;opacity:0}
.set-row.done .plate{opacity:1}
.field{position:relative;flex:1;min-width:0}
.field select{
  -webkit-appearance:none;appearance:none;width:100%;min-height:var(--tap);
  padding:0 26px 0 12px;border-radius:var(--r-xs);
  background:var(--surface-container-high);border:1px solid transparent;
  font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;
}
.field select:focus{border-color:var(--primary);outline:none}
.field::after{
  content:"";position:absolute;right:11px;top:50%;width:7px;height:7px;
  border-right:2px solid var(--on-surface-variant);border-bottom:2px solid var(--on-surface-variant);
  transform:translateY(-70%) rotate(45deg);pointer-events:none;
}
.field .unit{
  position:absolute;left:50%;top:50%;transform:translateY(-50%);
  font-size:11px;color:var(--on-surface-variant);pointer-events:none;
}
.check{
  width:var(--tap);height:var(--tap);flex:none;border-radius:var(--r-xs);
  background:var(--surface-container-high);color:var(--on-surface-variant);
  display:grid;place-items:center;transition:background .15s ease,color .15s ease;
}
.set-row.done .check{background:var(--success);color:#05320F}
.set-row.done select{opacity:.65}
.checkoff{
  flex:1;min-height:var(--tap);border-radius:var(--r-xs);
  background:var(--surface-container-high);display:flex;align-items:center;
  padding:0 12px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--on-surface-variant);
}
.set-row.done .checkoff{color:var(--success)}
.card-actions{display:flex;gap:6px;padding:2px 0 6px;flex-wrap:wrap}
.chip{
  min-height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--outline-variant);
  display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--on-surface-variant);
}
.chip:hover{background:var(--surface-container-high);color:var(--on-surface)}
.chip .ic{width:16px;height:16px}
.chip.danger{color:var(--error);border-color:rgba(255,180,171,.3)}
.card-actions[hidden]{display:none}

/* ---------- Finish block ---------- */
.finish{background:var(--surface-container-low);border-radius:var(--r-l);padding:18px 16px;margin-top:8px}
.sentiments{display:flex;gap:8px;margin:12px 0 16px}
.sent{
  flex:1;min-height:76px;border-radius:var(--r-m);border:1px solid var(--outline-variant);
  background:var(--surface-container);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;color:var(--on-surface-variant);font-size:12px;font-weight:650;
}
.sent .ic{width:26px;height:26px}
.sent[aria-pressed="true"]{background:var(--primary-container);color:var(--on-primary-container);border-color:transparent}
.filled{
  width:100%;min-height:52px;border-radius:99px;background:var(--primary);color:var(--on-primary);
  font-size:16px;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:8px;
}
.filled:disabled{background:var(--surface-container-highest);color:var(--outline);cursor:not-allowed}
.text-btn{
  min-height:var(--tap);width:100%;color:var(--on-surface-variant);font-size:13px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;
}

/* ---------- History ---------- */
.stats{display:flex;gap:8px;margin-bottom:18px}
.stat{
  flex:1;background:var(--surface-container-low);border-radius:var(--r-m);padding:12px 12px 14px;
  border:1px solid var(--outline-variant);
}
.stat b{display:block;font-size:22px;font-weight:750;letter-spacing:-.02em;margin-top:4px}
.log{
  width:100%;text-align:left;background:var(--surface-container);border-radius:var(--r-m);
  padding:14px;margin-bottom:10px;display:block;cursor:pointer;
}
.log:hover{background:var(--surface-container-high)}
.log-head{display:flex;align-items:center;gap:10px}
.log-head .grow{flex:1;min-width:0}
.log-head .ic{width:24px;height:24px;color:var(--primary)}
.log-figs{display:flex;gap:16px;margin-top:12px;padding-top:12px;border-top:1px solid var(--outline-variant)}
.log-figs div{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--on-surface-variant)}
.log-figs b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--on-surface);margin-top:2px}
.log-detail{margin-top:12px;padding-top:12px;border-top:1px solid var(--outline-variant);font-size:13px}
.log-detail[hidden]{display:none}
.log-detail li{list-style:none;display:flex;justify-content:space-between;gap:12px;padding:4px 0;color:var(--on-surface-variant)}
.log-detail li span:first-child{color:var(--on-surface)}
.log-detail ul{margin:0;padding:0}

/* ---------- Calendar ---------- */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cal-head .m{flex:1;text-align:center;font-size:15px;font-weight:700;letter-spacing:.02em}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.dow span{text-align:center;font-size:10px;letter-spacing:.08em;color:var(--on-surface-variant);text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{
  aspect-ratio:1;border-radius:var(--r-s);background:var(--surface-container-low);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:13px;font-variant-numeric:tabular-nums;color:var(--on-surface-variant);
}
.cell.blank{background:none}
.cell.today{border:1px solid var(--primary);color:var(--primary);font-weight:700}
.cell .dots{display:flex;gap:3px;height:6px}
.cell .dots i{width:6px;height:6px;border-radius:50%;background:var(--primary)}
.cell.logged{background:var(--surface-container-high);color:var(--on-surface)}

/* ---------- Coach ---------- */
.window{display:flex;gap:6px;margin:4px 0 18px}
.window .chip{flex:1;justify-content:center;min-height:var(--tap)}
.window .chip[aria-pressed="true"]{background:var(--primary-container);color:var(--on-primary-container);border-color:transparent}
.mgroup{margin-bottom:22px}
.mrow{margin-bottom:14px}
.mhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:5px}
.mhead span{font-size:14px;font-weight:600}
.mhead b{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--on-surface-variant)}
.mhead b em{font-style:normal;color:var(--outline)}
.mbar{position:relative;height:12px;border-radius:99px;background:var(--surface-container);overflow:hidden}
.mbar i{position:absolute;inset:0 auto 0 0;width:var(--f,0);background:var(--c,var(--primary));border-radius:99px;transition:width .4s cubic-bezier(.2,0,0,1)}
.mbar u{position:absolute;top:0;bottom:0;left:var(--t,45%);width:2px;background:var(--surface);opacity:.9}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:-4px 0 20px}
.legend span{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--on-surface-variant)}
.legend i{width:10px;height:10px;border-radius:3px;display:block}
.brief{
  width:100%;height:220px;border-radius:var(--r-s);border:1px solid var(--outline-variant);
  background:var(--surface-container-low);color:var(--on-surface-variant);
  padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.5;
  resize:vertical;margin-top:12px;
}
.callout{
  background:var(--surface-container-low);border:1px solid var(--outline-variant);
  border-radius:var(--r-m);padding:14px 16px;margin-bottom:20px;
}
.callout p{margin:6px 0 0;font-size:13px;color:var(--on-surface-variant)}

/* ---------- Modal / sheet ---------- */
.scrim{
  position:fixed;inset:0;z-index:40;background:var(--scrim);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fade .18s ease;
}
.scrim[hidden]{display:none}
.sheet{
  width:100%;max-width:560px;max-height:86dvh;overflow:auto;
  background:var(--surface-container-high);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom));
  animation:rise .24s cubic-bezier(.2,0,0,1);
}
.handle{width:32px;height:4px;border-radius:99px;background:var(--outline);margin:6px auto 12px}
.sheet h2{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px}
.filters{display:flex;gap:6px;overflow-x:auto;padding:12px 0;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{white-space:nowrap;min-height:36px}
.filters .chip[aria-pressed="true"]{background:var(--secondary-container);color:var(--on-secondary-container);border-color:transparent}
.search{
  width:100%;min-height:var(--tap);border-radius:var(--r-s);border:1px solid var(--outline-variant);
  background:var(--surface-container-low);padding:0 14px;font-size:15px;
}
.search::placeholder{color:var(--outline)}
.opt{
  width:100%;text-align:left;min-height:56px;padding:10px 12px;border-radius:var(--r-s);
  display:flex;align-items:center;gap:10px;
}
.opt:hover{background:var(--surface-container-highest)}
.opt .grow{flex:1;min-width:0;display:block}
.opt b{display:block;font-size:15px;font-weight:600}
.opt small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--on-surface-variant)}
.opt.current{background:var(--primary-container);color:var(--on-primary-container)}
.opt.current small{color:var(--on-primary-container);opacity:.8}
.sheet-list{margin:0 -4px}
.rowbtn{
  width:100%;text-align:left;min-height:var(--tap);padding:12px;border-radius:var(--r-s);
  display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;
}
.rowbtn:hover{background:var(--surface-container-highest)}
.rowbtn.danger{color:var(--error)}
.rowbtn small{display:block;font-size:12px;font-weight:400;color:var(--on-surface-variant);letter-spacing:0}

/* ---------- Misc ---------- */
.empty{
  text-align:center;padding:48px 24px;color:var(--on-surface-variant);
  border:1px dashed var(--outline-variant);border-radius:var(--r-m);
}
.empty b{display:block;color:var(--on-surface);font-size:16px;margin-bottom:6px}
.banner{
  display:flex;gap:10px;align-items:flex-start;background:var(--secondary-container);
  color:var(--on-secondary-container);border-radius:var(--r-s);padding:10px 12px;
  font-size:13px;margin-bottom:16px;
}
.banner[hidden]{display:none}
.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px);transform:translateX(-50%);
  background:var(--surface-container-highest);color:var(--on-surface);
  padding:12px 18px;border-radius:var(--r-s);font-size:14px;z-index:50;
  box-shadow:0 6px 20px rgba(0,0,0,.5);animation:fade .2s ease;
}
.toast[hidden]{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

MUSCLES.forEach(function (m) { MUSCLE_NAME[m.key] = m.name; });

/* Weekly set targets. 10 is the working minimum, 20 the upper end of the

var VOL_MIN = 10, VOL_MAX = 20;

var EX_BY_ID = {};
EXERCISES.forEach(function (e) { EX_BY_ID[e.id] = e; });

/* ============================================================

var PHASES = [

];
var PHASE_OF_TYPE = {};
PHASES.forEach(function (p) { p.types.forEach(function (t) { PHASE_OF_TYPE[t] = p; }); });
function phaseOf(exId) {
  var ex = EX_BY_ID[exId];
  return (ex && PHASE_OF_TYPE[ex.type]) || PHASES[1];
}
function isCheckoff(exId) {
  var ex = EX_BY_ID[exId];
  return !!ex && (ex.type === 'warmup' || ex.type === 'warmdown');

/* ============================================================
   4. STORAGE — localStorage with an in-memory fallback
   ============================================================ */
var Store = (function () {
  var ok = true, mem = {};
  try {
    window.localStorage.setItem('__probe', '1');
    window.localStorage.removeItem('__probe');
  } catch (e) { ok = false; }
  return {
    persistent: ok,
    get: function (k, fallback) {
      try {
        var raw = ok ? window.localStorage.getItem(k) : mem[k];
        return raw == null ? fallback : JSON.parse(raw);
      } catch (e) { return fallback; }
    },
    set: function (k, v) {
      var raw = JSON.stringify(v);
      try {
        if (ok) window.localStorage.setItem(k, raw); else mem[k] = raw;
      } catch (e) { ok = false; mem[k] = raw; }
    },
    del: function (k) {
      try { if (ok) window.localStorage.removeItem(k); else delete mem[k]; } catch (e) {}
    }
  };
})();

var K = { program: 'hg.program.v1', history: 'hg.history.v1', session: 'hg.session.v1', meta: 'hg.meta.v1' };

function clone(o) { return JSON.parse(JSON.stringify(o)); }
function $(sel, root) { return (root || document).querySelector(sel); }
function esc(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function icon(name, cls) { return '<svg class="ic ' + (cls || '') + '"><use href="#i-' + name + '"></use></svg>'; }
function uid() { return Math.random().toString(36).slice(2, 9); }
function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function dateKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function fmtNum(n) { return Math.round(n).toLocaleString('en-US'); }
function bigVolume(v) {
  return v >= 10000 ? (v / 1000).toFixed(1) + 't' : fmtNum(v) + ' kg';
}
function fmtWeight(w) {
  if (w == null || w === '') return null;
  return (Math.round(w * 10) / 10) + ' kg';
}
/* Data integrity: reps may be "Max", "8-10" or a plain number. */
function repsToNumber(r) {
  if (typeof r === 'number' && isFinite(r)) return r;
  var t = String(r == null ? '' : r).trim();
  if (/^\d+$/.test(t)) return parseInt(t, 10);
  var range = t.match(/^(\d+)\s*[-\u2013]\s*(\d+)$/);
  if (range) return parseInt(range[1], 10);
  return 0;
}
function setVolume(set) {
  var w = parseFloat(set.w);
  if (!isFinite(w) || w <= 0) return 0;
  return w * repsToNumber(set.r);
}
function plateColor(w) {
  var v = parseFloat(w);
  if (!isFinite(v) || v <= 0) return 'var(--plate-0)';
  if (v >= 100) return 'var(--plate-25)';
  if (v >= 60) return 'var(--plate-20)';
  if (v >= 30) return 'var(--plate-15)';
  return 'var(--plate-10)';
}
function relDate(iso) {
  var d = new Date(iso + 'T00:00:00');
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var days = Math.round((today - d) / 86400000);
  if (days === 0) return 'Today';
  if (days === 1) return 'Yesterday';
  if (days < 7) return days + ' days ago';
  return d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
}

  return SENTIMENTS[1];
}

/* Prefill from the last time this exercise was logged. */
function lastPerformance(exId) {
  for (var i = state.history.length - 1; i >= 0; i--) {
    var w = state.history[i];
    for (var j = 0; j < w.exercises.length; j++) {
      var e = w.exercises[j];
      if (e.ex !== exId) continue;
      var best = null;
      e.sets.forEach(function (st) {
        if (st.w != null && (best == null || parseFloat(st.w) > parseFloat(best.w))) best = st;
      });
      return { date: w.date, set: best || e.sets[0] || null };
    }
  }
  return null;
}

var WEIGHT_OPTIONS = (function () {
  var out = '<option value="">— kg</option>';
  for (var w = 0; w <= 200; w += 2.5) {
    var label = (w % 1 === 0 ? w : w.toFixed(1));
    out += '<option value="' + w + '">' + label + ' kg</option>';
  }
  return out;
})();
var REP_OPTIONS = (function () {
  var common = ['Max', 'AMRAP', '3-5', '5-8', '6-8', '8-10', '8-12', '10-12', '12-15', '15-20', '20-30'];
  var out = '<optgroup label="Targets">';
  common.forEach(function (c) { out += '<option value="' + c + '">&times; ' + c + '</option>'; });
  out += '</optgroup><optgroup label="Reps">';
  for (var r = 1; r <= 50; r++) out += '<option value="' + r + '">&times; ' + r + '</option>';
  return out + '</optgroup>';
})();

/* ============================================================
   6. SESSION
   ============================================================ */
function suggestedDay() {
  if (state.meta.lastDay == null) return 0;
  return (state.meta.lastDay + 1) % state.program.length;
}
function buildSession(dayIndex) {
  var day = state.program[dayIndex];
  return {
    day: dayIndex,
    title: day.title,
    started: new Date().toISOString(),
    sentiment: null,
    exercises: day.items.map(function (item) {
      var last = lastPerformance(item.ex);
      var prefill = last && last.set && last.set.w != null ? last.set.w : null;
      var sets = [];
      for (var i = 0; i < item.sets; i++) {
        sets.push({ w: isCheckoff(item.ex) ? null : prefill, r: item.reps, done: false });
      }
      return { uid: uid(), ex: item.ex, sets: sets };
    })
  };
}
function ensureSession() {
  if (state.session && state.program[state.session.day]) return;
  state.session = buildSession(suggestedDay());
  saveSession();
}
function sessionCounts(sess) {
  var total = 0, done = 0, volume = 0, exDone = 0;
  sess.exercises.forEach(function (e) {
    var any = false;
    e.sets.forEach(function (st) {
      total++;
      if (st.done) { done++; any = true; volume += setVolume(st); }
    });
    if (any) exDone++;
  });
  return { total: total, done: done, volume: volume, exDone: exDone };
}
function findEx(u) {
  for (var i = 0; i < state.session.exercises.length; i++) {
    if (state.session.exercises[i].uid === u) return state.session.exercises[i];
  }
  return null;
}

/* ============================================================
   7. TRAIN VIEW
   ============================================================ */
function renderTrain() {
  ensureSession();
  var sess = state.session;
  var counts = sessionCounts(sess);
  var html = '';

  /* Day switcher */
  html += '<div class="days">';
  state.program.forEach(function (d, i) {
    html += '<button class="day-chip" data-act="day" data-i="' + i + '" aria-pressed="' + (i === sess.day) + '">' +
      '<b>Day ' + (i + 1) + '</b><span>' + esc(shortTitle(d.title)) + '</span></button>';
  });
  html += '</div>';

  /* Progress rail */
  html += railHtml(sess, counts);

  /* Phase groups */
  PHASES.forEach(function (phase, pi) {
    var group = sess.exercises.filter(function (e) { return phaseOf(e.ex).key === phase.key; });
    if (!group.length) return;
    html += '<section class="phase-group" style="--phase-c:' + phase.color + '">' +
      '<div class="phase"><span class="idx">' + String(pi + 1).padStart(2, '0') + '</span>' +
      '<span class="name">' + phase.label + '</span><span class="rule"></span></div>';
    group.forEach(function (e) { html += cardHtml(e); });
    html += '</section>';
  });

  /* Finish */
  html += finishHtml(sess, counts);

  var root = $('#view-train');
  root.innerHTML = html;
  $('#topEyebrow').textContent = 'Day ' + (sess.day + 1) + ' · ' + new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
  $('#topTitle').textContent = sess.title;

  /* Selects can't carry their value through innerHTML reliably — set them here. */
  sess.exercises.forEach(function (e) {
    e.sets.forEach(function (st, i) {
      var row = root.querySelector('[data-uid="' + e.uid + '"] [data-set="' + i + '"]');
      if (!row) return;
      var w = row.querySelector('[data-act="weight"]');
      var r = row.querySelector('[data-act="reps"]');
      if (w) setSelect(w, st.w == null ? '' : String(st.w));
      if (r) setSelect(r, st.r == null ? '' : String(st.r));
    });
  });
}

/* Keeps a select honest even if an imported value is not in the option list. */
function setSelect(sel, value) {
  sel.value = value;
  if (sel.value !== value) {
    var opt = document.createElement('option');
    opt.value = value; opt.textContent = value;
    sel.insertBefore(opt, sel.firstChild);
    sel.value = value;
  }
}

function shortTitle(t) { return t.split(' & ')[0]; }

function railHtml(sess, counts) {
  var segs = '', legend = '';
  PHASES.forEach(function (phase) {
    var t = 0, d = 0;
    sess.exercises.forEach(function (e) {
      if (phaseOf(e.ex).key !== phase.key) return;
      e.sets.forEach(function (st) { t++; if (st.done) d++; });
    });
    if (!t) return;
    segs += '<div class="seg" style="--w:' + t + '"><i style="--f:' + (d / t * 100) + '%;--c:' + phase.color + '"></i></div>';
    legend += '<span style="--w:' + t + '">' + phase.label + '</span>';
  });
  return '<div class="rail" id="rail">' +
    '<div class="rail-head">' +
      '<div class="big num" id="railSets">' + counts.done + ' <small>of ' + counts.total + ' sets</small></div>' +
      '<div class="big num" id="railVol">' + fmtNum(counts.volume) + ' <small>kg lifted</small></div>' +
    '</div>' +
    '<div class="bar">' + segs + '</div>' +
    '<div class="rail-legend">' + legend + '</div>' +
  '</div>';
}

function cardHtml(e) {
  var ex = EX_BY_ID[e.ex] || { name: 'Unknown exercise', type: 'accessory', category: 'bw', note: '' };
  var phase = phaseOf(e.ex);
  var checkoff = isCheckoff(e.ex);
  var allDone = e.sets.length > 0 && e.sets.every(function (st) { return st.done; });
  var last = lastPerformance(e.ex);
  var meta = ex.type + ' · ' + CATEGORIES[ex.category];
  if (last && last.set && last.set.w != null && !checkoff) {
    meta = 'Last: ' + fmtWeight(last.set.w) + ' × ' + esc(last.set.r) + ' · ' + relDate(last.date);
  }

  var rows = '';
  e.sets.forEach(function (st, i) {
    rows += '<div class="set-row' + (st.done ? ' done' : '') + '" data-set="' + i + '">' +
      '<div class="set-no"><i class="plate" style="background:' + (checkoff ? 'var(--plate-0)' : plateColor(st.w)) + '"></i>' + (i + 1) + '</div>';
    if (checkoff) {
      rows += '<div class="checkoff">Bodyweight</div>';
    } else {
      rows += '<div class="field"><select data-act="weight" aria-label="Weight for set ' + (i + 1) + '">' + WEIGHT_OPTIONS + '</select></div>' +
              '<div class="field"><select data-act="reps" aria-label="Reps for set ' + (i + 1) + '">' + REP_OPTIONS + '</select></div>';
    }
    rows += '<button class="check" data-act="toggle" aria-pressed="' + st.done + '" aria-label="' +
      (st.done ? 'Undo set ' : 'Complete set ') + (i + 1) + '">' + icon('check') + '</button></div>';
  });

  return '<article class="card' + (allDone ? ' done' : '') + '" data-uid="' + e.uid + '" style="--phase-c:' + phase.color + '">' +
    '<div class="card-head"><div class="grow"><h3>' + esc(ex.name) + '</h3><div class="meta">' + esc(meta) + '</div></div>' +
    '<button class="icon-btn" data-act="menu" aria-label="Options for ' + esc(ex.name) + '">' + icon('more') + '</button></div>' +
    (ex.note ? '<p class="note">' + esc(ex.note) + '</p>' : '') +
    '<div class="sets">' + rows + '</div>' +
    '<div class="card-actions">' +
      '<button class="chip" data-act="addset">' + icon('plus') + 'Add set</button>' +
      '<button class="chip" data-act="swap">' + icon('swap') + 'Swap</button>' +
    '</div></article>';
}

function finishHtml(sess, counts) {
  var sents = '';
  SENTIMENTS.forEach(function (s) {
    sents += '<button class="sent" data-act="sentiment" data-key="' + s.key + '" aria-pressed="' +
      (sess.sentiment === s.key) + '">' + icon(s.icon) + s.label + '</button>';
  });
  var ready = !!sess.sentiment && counts.done > 0;
  var hint = counts.done === 0 ? 'Log at least one set to save this workout.'
    : (!sess.sentiment ? 'Pick how it felt to save this workout.' : counts.done + ' sets across ' + counts.exDone + ' exercises.');
  return '<div class="finish">' +
    '<p class="eyebrow">Finish</p><h2 class="title">How did that feel?</h2>' +
    '<div class="sentiments">' + sents + '</div>' +
    '<button class="filled" data-act="save"' + (ready ? '' : ' disabled') + '>' + icon('check') + 'Save workout</button>' +
    '<p class="body-s" style="text-align:center;margin-top:10px">' + esc(hint) + '</p>' +
    '<button class="text-btn" data-act="discard">' + icon('reset') + 'Start this day over</button>' +
  '</div>';
}

/* Surgical updates so the big <select> lists are never rebuilt mid-workout. */
function refreshRail() {
  var sess = state.session, counts = sessionCounts(sess);
  var railSets = $('#railSets'), railVol = $('#railVol');
  if (railSets) railSets.innerHTML = counts.done + ' <small>of ' + counts.total + ' sets</small>';
  if (railVol) railVol.innerHTML = fmtNum(counts.volume) + ' <small>kg lifted</small>';
  var segs = $('#rail') ? $('#rail').querySelectorAll('.bar .seg i') : [];
  var k = 0;
  PHASES.forEach(function (phase) {
    var t = 0, d = 0;
    sess.exercises.forEach(function (e) {
      if (phaseOf(e.ex).key !== phase.key) return;
      e.sets.forEach(function (st) { t++; if (st.done) d++; });
    });
    if (!t) return;
    if (segs[k]) segs[k].style.setProperty('--f', (d / t * 100) + '%');
    k++;
  });
  var fin = $('#view-train .finish');
  if (fin) {
    var wrap = document.createElement('div');
    wrap.innerHTML = finishHtml(sess, counts);
    fin.replaceWith(wrap.firstChild);
  }
}

/* ============================================================
   9b. COACH — weekly volume analysis
   Set counting happens here, in code, so the numbers are exact.
   The model is only asked to interpret them.
   ============================================================ */
function analyze(days) {
  var cutoff = new Date();
  cutoff.setHours(0, 0, 0, 0);
  cutoff.setDate(cutoff.getDate() - (days - 1));
  var from = dateKey(cutoff);

  var logs = state.history.filter(function (w) { return w.date >= from; });
  var weeks = days / 7;
  var vol = {}, seen = {};
  MUSCLES.forEach(function (m) { vol[m.key] = 0; seen[m.key] = {}; });

  var working = 0, powerSets = 0, mobility = 0, conditioning = 0;

  logs.forEach(function (w) {
    w.exercises.forEach(function (e) {
      var ex = EX_BY_ID[e.ex];
      if (!ex) return;
      var n = e.sets.length;
      if (ex.type === 'warmup' || ex.type === 'warmdown') { mobility += n; return; }
      if (ex.type === 'power') { powerSets += n; return; }
      if (ex.category === 'bike') { conditioning += n; return; }
      working += n;
      Object.keys(ex.muscles).forEach(function (k) {
        if (!(k in vol)) return;
        vol[k] += n * ex.muscles[k];
        seen[k][w.date] = true;
      });
    });
  });

  var rows = MUSCLES.map(function (m) {
    var weekly = vol[m.key] / weeks;
    var freq = Object.keys(seen[m.key]).length / weeks;
    var zone = weekly === 0 ? 'none' : weekly < VOL_MIN ? 'under' : weekly <= VOL_MAX ? 'target' : 'over';
    return { key: m.key, name: m.name, weekly: weekly, freq: freq, zone: zone };
  });

  return {
    days: days, weeks: weeks, from: from, logs: logs,
    sessions: logs.length, sessionsPerWeek: logs.length / weeks,
    working: working, powerSets: powerSets, mobility: mobility, conditioning: conditioning,
    rows: rows
  };
}

var ZONE_COLOR = { none: 'var(--outline-variant)', under: 'var(--plate-15)', target: 'var(--plate-10)', over: 'var(--plate-20)' };

function renderCoach() {
  $('#topEyebrow').textContent = 'Volume review';
  $('#topTitle').textContent = 'Coach';
  var root = $('#view-coach');

  if (!state.history.length) {
    root.innerHTML = '<div class="empty"><b>Nothing to review yet</b>Save a few workouts and this becomes a weekly set count per muscle.</div>';
    return;
  }

  var a = analyze(state.coachWindow);
  var scale = Math.max(VOL_MAX + 4, Math.ceil(Math.max.apply(null, a.rows.map(function (r) { return r.weekly; })) + 2));

  var html = '<div class="window">' +
    [[7, 'Last 7 days'], [28, 'Last 4 weeks']].map(function (w) {
      return '<button class="chip" data-act="window" data-days="' + w[0] + '" aria-pressed="' +
        (state.coachWindow === w[0]) + '">' + w[1] + '</button>';
    }).join('') + '</div>';

  if (!a.sessions) {
    html += '<div class="empty"><b>No sessions in this window</b>Try the wider window, or train something.</div>';
    root.innerHTML = html;
    return;
  }

  html += '<div class="stats">' +
    '<div class="stat"><span class="eyebrow">Sessions / wk</span><b class="num">' + round1(a.sessionsPerWeek) + '</b></div>' +
    '<div class="stat"><span class="eyebrow">Working sets</span><b class="num">' + a.working + '</b></div>' +
    '<div class="stat"><span class="eyebrow">Power sets</span><b class="num">' + a.powerSets + '</b></div>' +
  '</div>';

  html += '<div class="legend">' +
    '<span><i style="background:' + ZONE_COLOR.under + '"></i>Under ' + VOL_MIN + '</span>' +
    '<span><i style="background:' + ZONE_COLOR.target + '"></i>' + VOL_MIN + '\u2013' + VOL_MAX + '</span>' +
    '<span><i style="background:' + ZONE_COLOR.over + '"></i>Over ' + VOL_MAX + '</span>' +
    '<span>Tick marks ' + VOL_MIN + ' sets</span></div>';

  html += '<div class="mgroup">' + a.rows.map(function (r) {
    return '<div class="mrow">' +
      '<div class="mhead"><span>' + r.name + '</span><b class="num">' + round1(r.weekly) + ' sets' +
        (r.freq > 0 ? ' \u00b7 ' + round1(r.freq) + '\u00d7/wk' : ' <em>\u00b7 untrained</em>') + '</b></div>' +
      '<div class="mbar"><i style="--f:' + Math.min(100, r.weekly / scale * 100) + '%;--c:' + ZONE_COLOR[r.zone] + '"></i>' +
      '<u style="--t:' + (VOL_MIN / scale * 100) + '%"></u></div></div>';
  }).join('') + '</div>';

  html += '<div class="callout"><p class="eyebrow" style="color:var(--on-surface)">How these are counted</p>' +
    '<p>A set counts fully for the muscle an exercise trains directly and half for meaningful secondary work. ' +
    'Activation and cool-down movements count for nothing, and the ' + a.powerSets + ' power sets are tracked separately \u2014 ' +
    'explosive work builds output, not much size.</p>' +
    '<p>Weekly figures are averaged over the window, so a light week pulls them down.</p></div>';

  html += '<button class="filled" data-act="copybrief">' + icon('copy') + 'Copy brief for Claude</button>' +
    '<button class="text-btn" data-act="viewbrief">' + icon('open') + 'Read it first</button>';

  root.innerHTML = html;
}

function round1(n) { return Math.round(n * 10) / 10; }

/* ---------- The brief handed to Claude ---------- */
function coachBrief(days) {
  var a = analyze(days);
  var L = [];

  L.push('You are reviewing my home gym training log as a hypertrophy coach. Ground your assessment in the resistance training volume literature — Brad Schoenfeld\u2019s work on volume dose-response and training frequency in particular.');
  L.push('');
  L.push('## How to read my numbers');
  L.push('- Weekly sets are already computed. A set counts 1.0 for a muscle the exercise trains directly and 0.5 for meaningful secondary work.');
  L.push('- Warm-up and cool-down movements are excluded. Explosive/power sets (cleans, jumps, plyo push-ups) are counted separately and excluded from hypertrophy volume.');
  L.push('- Figures are averaged over the last ' + days + ' days (' + round1(a.weeks) + (a.weeks === 1 ? ' week' : ' weeks') + '), from ' + a.from + ' to ' + dateKey(new Date()) + '.');
  L.push('- Fractional secondary counting is a convention, not a finding. Say so if it is distorting anything.');
  L.push('');
  L.push('## Training frequency');
  L.push(a.sessions + ' sessions in the window (' + round1(a.sessionsPerWeek) + '/week), ' + a.working +
    ' working sets, ' + a.powerSets + ' power sets, ' + a.mobility + ' mobility sets.');
  L.push('');
  L.push('## Weekly sets per muscle');
  a.rows.forEach(function (r) {
    L.push('- ' + r.name + ': ' + round1(r.weekly) + ' sets/wk across ' + round1(r.freq) + ' sessions/wk');
  });
  L.push('');
  L.push('## Sessions in this window');
  a.logs.slice(-8).forEach(function (w) {
    L.push(w.date + ' \u00b7 Day ' + (w.day + 1) + ' \u00b7 ' + w.title + ' \u00b7 felt ' + sentiment(w.sentiment).label.toLowerCase());
    var mob = 0;
    w.exercises.forEach(function (e) {
      var ex = EX_BY_ID[e.ex];
      if (!ex) return;
      if (ex.type === 'warmup' || ex.type === 'warmdown') { mob += e.sets.length; return; }
      var sets = e.sets.map(function (st) {
        return (st.w != null ? st.w + 'kg\u00d7' + st.r : st.r === '1' ? 'done' : st.r);
      }).join(', ');
      L.push('  ' + ex.name + ' — ' + sets);
    });
    if (mob) L.push('  (plus ' + mob + ' activation / cool-down sets)');
  });
  L.push('');
  L.push('## My current programme');
  state.program.forEach(function (d, i) {
    L.push('Day ' + (i + 1) + ' — ' + d.title);
    d.items.forEach(function (item) {
      var ex = EX_BY_ID[item.ex];
      if (ex) L.push('  ' + ex.name + ' ' + item.sets + '\u00d7' + item.reps);
    });
  });
  L.push('');
  L.push('## Equipment I own, and every exercise available to me');
  Object.keys(CATEGORIES).forEach(function (c) {
    var names = EXERCISES.filter(function (e) { return e.category === c && e.type !== 'warmup' && e.type !== 'warmdown'; })
      .map(function (e) { return e.name; });
    if (names.length) L.push('- ' + CATEGORIES[c] + ': ' + names.join(', '));
  });
  L.push('');
  L.push('## What I want from you');
  L.push('1. Assess each muscle against the evidence for weekly volume, and say which ones are genuinely under-stimulated rather than just low on the table.');
  L.push('2. Flag anything trained less than twice a week, since frequency matters at matched volume.');
  L.push('3. Suggest specific changes — which exercise, which day, how many sets. Use only exercises from the list above. If something I need is missing, say what equipment would fix it.');
  L.push('4. Keep each session roughly the same length. If you add sets somewhere, say what comes out.');
  L.push('5. Tell me where you are uncertain, and where my numbers are too thin to conclude anything.');

  return L.join('\n');
}

function copyBrief() {
  var text = coachBrief(state.coachWindow);
  var done = function () { toast('Brief copied \u2014 paste it into Claude'); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { showBrief(text); });
  } else {
    showBrief(text);
  }
}

function showBrief(text) {
  openSheet('<h2>Brief for Claude</h2><p class="body-s">Select all and copy, then paste it into a new Claude conversation.</p>' +
    '<textarea class="brief" readonly id="briefBox"></textarea>' +
    '<button class="filled" style="margin-top:12px" data-act="selectbrief">Select all</button>' +
    '<button class="text-btn" data-act="openclaude">' + icon('open') + 'Open Claude</button>');
  $('#briefBox').value = text;
}

/* ============================================================
   10. SHEETS, TOASTS, NAVIGATION
   ============================================================ */
var sheetEl = $('#sheet'), scrimEl = $('#scrim'), toastEl = $('#toast'), toastTimer = null;

function openSheet(html) {
  sheetEl.innerHTML = '<div class="handle"></div>' + html;
  scrimEl.hidden = false;
  sheetEl.scrollTop = 0;
}
function closeSheet() { scrimEl.hidden = true; sheetEl.innerHTML = ''; }
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.hidden = true; }, 2600);
}
function confirmSheet(title, body, confirmLabel, onConfirm, danger) {
  openSheet('<h2>' + esc(title) + '</h2><p class="body-s">' + esc(body) + '</p>' +
    '<div style="margin-top:18px"><button class="filled" data-act="confirm-yes"' +
    (danger ? ' style="background:var(--error);color:#5C0F09"' : '') + '>' + esc(confirmLabel) + '</button>' +
    '<button class="text-btn" data-act="confirm-no">Cancel</button></div>');
  scrimEl._onConfirm = onConfirm;
}

function setView(v) {
  state.view = v;
  ['train', 'coach', 'history', 'calendar'].forEach(function (name) {
    $('#view-' + name).hidden = name !== v;
  });
  document.querySelectorAll('nav.bottom .tab').forEach(function (t) {
    t.setAttribute('aria-selected', String(t.dataset.view === v));
  });
  window.scrollTo(0, 0);
  if (v === 'train') renderTrain();
  if (v === 'coach') renderCoach();
  if (v === 'history') renderHistory();
  if (v === 'calendar') renderCalendar();
}

/* ============================================================
   11. ACTIONS
   ============================================================ */
function openExerciseMenu(u) {
  var e = findEx(u);
  if (!e) return;
  var ex = EX_BY_ID[e.ex] || {};
  openSheet('<h2>' + esc(ex.name || 'Exercise') + '</h2>' +
    '<p class="body-s">' + esc(phaseOf(e.ex).label) + ' · ' + e.sets.length + ' sets</p>' +
    '<div class="sheet-list" style="margin-top:12px">' +
      '<button class="rowbtn" data-act="swap" data-uid="' + u + '">' + icon('swap') + 'Swap exercise</button>' +
      '<button class="rowbtn" data-act="addset" data-uid="' + u + '">' + icon('plus') + 'Add a set</button>' +
      '<button class="rowbtn" data-act="rmset" data-uid="' + u + '">' + icon('minus') + 'Remove last set</button>' +
      '<button class="rowbtn danger" data-act="delex" data-uid="' + u + '">' + icon('trash') + 'Remove from today</button>' +
    '</div>');
}

var swapState = { uid: null, cat: 'all', q: '' };

function openSwap(u) {
  swapState = { uid: u, cat: 'all', q: '' };
  var e = findEx(u);
  var ex = EX_BY_ID[e.ex] || {};
  var chips = '<button class="chip" data-act="cat" data-cat="all" aria-pressed="true">All</button>';
  Object.keys(CATEGORIES).forEach(function (c) {
    chips += '<button class="chip" data-act="cat" data-cat="' + c + '" aria-pressed="false">' + esc(CATEGORIES[c]) + '</button>';
  });
  openSheet('<h2>Swap ' + esc(ex.name || 'exercise') + '</h2>' +
    '<p class="body-s">Only kit you own is listed.</p>' +
    '<div class="filters">' + chips + '</div>' +
    '<input class="search" id="swapSearch" type="search" placeholder="Search exercises" autocomplete="off">' +
    '<div class="sheet-list" id="swapList" style="margin-top:8px"></div>');
  renderSwapList();
  var input = $('#swapSearch');
  input.addEventListener('input', function () { swapState.q = input.value.toLowerCase(); renderSwapList(); });
}

function renderSwapList() {
  var e = findEx(swapState.uid);
  var current = e ? e.ex : null;
  var list = EXERCISES.filter(function (ex) {
    if (swapState.cat !== 'all' && ex.category !== swapState.cat) return false;
    if (swapState.q && ex.name.toLowerCase().indexOf(swapState.q) === -1) return false;
    return true;
  });
  var html = list.map(function (ex) {
    return '<button class="opt' + (ex.id === current ? ' current' : '') + '" data-act="pick" data-id="' + ex.id + '">' +
      '<span class="grow"><b>' + esc(ex.name) + '</b><small>' + ex.type + ' · ' + esc(CATEGORIES[ex.category]) + '</small></span>' +
      (ex.id === current ? icon('check') : '') + '</button>';
  }).join('');
  $('#swapList').innerHTML = html || '<div class="empty"><b>Nothing matches</b>Try another filter or search term.</div>';
}

function openSettings() {
  var sess = state.session;
  openSheet('<h2>Settings</h2><p class="body-s">Everything lives on this device. Nothing is uploaded.</p>' +
    '<div class="sheet-list" style="margin-top:14px">' +
      (sess ? '<button class="rowbtn" data-act="savelayout">' + icon('down') +
        '<span>Save today\'s layout to Day ' + (sess.day + 1) + '<small>Keeps your swaps and set counts for next time</small></span></button>' +
        '<button class="rowbtn" data-act="resetday">' + icon('reset') +
        '<span>Reset Day ' + (sess.day + 1) + ' to default<small>Restores the original programme for this day</small></span></button>' : '') +
      '<button class="rowbtn" data-act="export">' + icon('down') + '<span>Export data<small>Downloads a JSON backup</small></span></button>' +
      '<button class="rowbtn" data-act="import">' + icon('up') + '<span>Import data<small>Replaces what is on this device</small></span></button>' +
      '<button class="rowbtn danger" data-act="clearall">' + icon('trash') + '<span>Delete everything<small>History, programme and today\'s session</small></span></button>' +
    '</div>' +
    '<p class="body-s" style="margin-top:16px">' + state.history.length + ' workouts saved · storage ' +
      (Store.persistent ? 'on this device' : 'unavailable in this browser') + '</p>' +
    '<input type="file" id="importFile" accept="application/json,.json" hidden>');
  $('#importFile').addEventListener('change', handleImport);
}

function handleImport(ev) {
  var file = ev.target.files && ev.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var data = JSON.parse(reader.result);
      if (!data || !Array.isArray(data.history)) throw new Error('bad');
      state.history = normalizeHistory(data.history);
      if (Array.isArray(data.program) && data.program.length) state.program = data.program;
      state.meta = data.meta || state.meta;
      state.session = null;
      saveHistory(); saveProgram(); saveMeta(); Store.del(K.session);
      closeSheet(); setView('history');
      toast('Imported ' + state.history.length + ' workouts');
    } catch (err) {
      toast("That file isn't a Home Gym backup");
    }
  };
  reader.readAsText(file);
}

function exportData() {
  var blob = new Blob([JSON.stringify({
    app: 'home-gym-tracker', version: 1, exported: new Date().toISOString(),
    program: state.program, history: state.history, meta: state.meta
  }, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'home-gym-' + dateKey(new Date()) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  toast('Backup downloaded');
}

function saveWorkout() {
  var sess = state.session, counts = sessionCounts(sess);
  if (!sess.sentiment || !counts.done) return;
  var exercises = sess.exercises.map(function (e) {
    return { ex: e.ex, sets: e.sets.filter(function (st) { return st.done; }).map(function (st) { return { w: st.w, r: st.r }; }) };
  }).filter(function (e) { return e.sets.length; });

  state.history.push({
    id: uid(), date: dateKey(new Date()), ts: Date.now(),
    day: sess.day, title: sess.title, sentiment: sess.sentiment,
    exercises: exercises,
    totals: { exercises: exercises.length, sets: counts.done, volume: Math.round(counts.volume) }
  });
  state.meta.lastDay = sess.day;
  state.session = null;
  saveHistory(); saveMeta(); Store.del(K.session);
  setView('history');
  toast('Workout saved · ' + fmtNum(counts.volume) + ' kg moved');
}

/* ============================================================
   12. EVENT WIRING
   ============================================================ */
document.querySelectorAll('nav.bottom .tab').forEach(function (tab) {
  tab.addEventListener('click', function () { setView(tab.dataset.view); });
});
$('#btnSettings').addEventListener('click', openSettings);
scrimEl.addEventListener('click', function (ev) { if (ev.target === scrimEl) closeSheet(); });
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !scrimEl.hidden) closeSheet(); });

/* Changes to weight / reps dropdowns */
document.addEventListener('change', function (ev) {
  var sel = ev.target.closest ? ev.target.closest('select[data-act]') : null;
  if (!sel) return;
  var card = sel.closest('.card'), row = sel.closest('.set-row');
  var e = findEx(card.dataset.uid);
  if (!e) return;
  var st = e.sets[parseInt(row.dataset.set, 10)];
  if (sel.dataset.act === 'weight') {
    st.w = sel.value === '' ? null : parseFloat(sel.value);
    row.querySelector('.plate').style.background = plateColor(st.w);
  } else {
    st.r = sel.value;
  }
  saveSession();
  refreshRail();
});

/* Everything else */
document.addEventListener('click', function (ev) {
  var btn = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (!btn) return;
  var act = btn.dataset.act;
  var card = btn.closest('.card');
  var u = btn.dataset.uid || (card && card.dataset.uid);

  switch (act) {
    case 'day': {
      var i = parseInt(btn.dataset.i, 10);
      if (i === state.session.day) return;
      var counts = sessionCounts(state.session);
      var go = function () {
        state.session = buildSession(i);
        saveSession(); closeSheet(); renderTrain();
      };
      if (counts.done > 0) {
        confirmSheet('Switch to Day ' + (i + 1) + '?',
          'The ' + counts.done + ' sets you logged today will be discarded.', 'Switch day', go, true);
      } else go();
      break;
    }
    case 'toggle': {
      var e = findEx(u);
      var row = btn.closest('.set-row');
      var st = e.sets[parseInt(row.dataset.set, 10)];
      st.done = !st.done;
      row.classList.toggle('done', st.done);
      btn.setAttribute('aria-pressed', String(st.done));
      card.classList.toggle('done', e.sets.every(function (x) { return x.done; }));
      saveSession(); refreshRail();
      break;
    }
    case 'addset': {
      var ex1 = findEx(u);
      var lastSet = ex1.sets[ex1.sets.length - 1];
      ex1.sets.push({ w: lastSet ? lastSet.w : null, r: lastSet ? lastSet.r : '8', done: false });
      saveSession(); closeSheet(); renderTrain();
      break;
    }
    case 'rmset': {
      var ex2 = findEx(u);
      if (ex2.sets.length <= 1) { toast('Keep at least one set, or remove the exercise'); return; }
      ex2.sets.pop();
      saveSession(); closeSheet(); renderTrain();
      break;
    }
    case 'delex': {
      var ex3 = findEx(u);
      var name = (EX_BY_ID[ex3.ex] || {}).name || 'this exercise';
      confirmSheet('Remove ' + name + '?', 'It stays in your programme — this only affects today.', 'Remove', function () {
        state.session.exercises = state.session.exercises.filter(function (item) { return item.uid !== u; });
        saveSession(); closeSheet(); renderTrain();
      }, true);
      break;
    }
    case 'menu': openExerciseMenu(u); break;
    case 'swap': openSwap(u); break;
    case 'cat':
      swapState.cat = btn.dataset.cat;
      sheetEl.querySelectorAll('[data-act="cat"]').forEach(function (c) {
        c.setAttribute('aria-pressed', String(c.dataset.cat === swapState.cat));
      });
      renderSwapList();
      break;
    case 'pick': {
      var target = findEx(swapState.uid);
      if (target) {
        target.ex = btn.dataset.id;
        var lp = lastPerformance(target.ex);
        target.sets.forEach(function (st2) {
          st2.done = false;
          st2.w = isCheckoff(target.ex) ? null : (lp && lp.set ? lp.set.w : null);
        });
        saveSession();
      }
      closeSheet(); renderTrain();
      break;
    }
    case 'sentiment':
      state.session.sentiment = state.session.sentiment === btn.dataset.key ? null : btn.dataset.key;
      saveSession(); refreshRail();
      break;
    case 'save': saveWorkout(); break;
    case 'discard':
      confirmSheet('Start Day ' + (state.session.day + 1) + ' over?',
        'Clears everything you have logged in this session.', 'Start over', function () {
          state.session = buildSession(state.session.day);
          saveSession(); closeSheet(); renderTrain();
        }, true);
      break;
    case 'log':
      state.openLog = state.openLog === btn.dataset.id ? null : btn.dataset.id;
      renderHistory();
      break;
    case 'month':
      state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth() + parseInt(btn.dataset.step, 10), 1);
      renderCalendar();
      break;
    case 'calday': {
      var day = btn.dataset.date;
      var logs = state.history.filter(function (w) { return w.date === day; });
      openSheet('<h2>' + new Date(day + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' }) + '</h2>' +
        logs.map(function (w) {
          var s2 = sentiment(w.sentiment);
          return '<div style="margin-top:14px"><p class="eyebrow" style="color:' + s2.color + '">Day ' + (w.day + 1) + ' · felt ' + s2.label.toLowerCase() + '</p>' +
            '<h3 class="title">' + esc(w.title) + '</h3>' +
            '<p class="body-s">' + w.totals.sets + ' sets · ' + w.totals.exercises + ' exercises · ' + fmtNum(w.totals.volume) + ' kg</p></div>';
        }).join(''));
      break;
    }
    case 'savelayout': {
      var sess2 = state.session;
      state.program[sess2.day].items = sess2.exercises.map(function (e2) {
        return { ex: e2.ex, sets: e2.sets.length, reps: e2.sets[0] ? e2.sets[0].r : '8' };
      });
      saveProgram(); closeSheet();
      toast('Day ' + (sess2.day + 1) + ' updated');
      break;
    }
    case 'resetday':
      confirmSheet('Reset Day ' + (state.session.day + 1) + '?', 'Restores the original exercises and set counts.', 'Reset day', function () {
        var d = state.session.day;
        state.program[d] = clone(DEFAULT_PROGRAM[d]);
        state.session = buildSession(d);
        saveProgram(); saveSession(); closeSheet(); setView('train');
        toast('Day ' + (d + 1) + ' reset');
      }, true);
      break;
    case 'window':
      state.coachWindow = parseInt(btn.dataset.days, 10);
      renderCoach();
      break;
    case 'copybrief': copyBrief(); break;
    case 'viewbrief': showBrief(coachBrief(state.coachWindow)); break;
    case 'selectbrief': {
      var box = $('#briefBox');
      box.removeAttribute('readonly');
      box.focus(); box.setSelectionRange(0, box.value.length);
      try { document.execCommand('copy'); toast('Brief copied'); } catch (err) { toast('Long-press the text to copy'); }
      box.setAttribute('readonly', 'readonly');
      break;
    }
    case 'openclaude': window.open('https://claude.ai/new', '_blank', 'noopener'); break;
    case 'export': exportData(); break;
    case 'import': $('#importFile').click(); break;
    case 'clearall':
      confirmSheet('Delete everything?', 'All saved workouts and programme edits on this device. This cannot be undone.', 'Delete everything', function () {
        state.history = []; state.program = clone(DEFAULT_PROGRAM); state.meta = { lastDay: null }; state.session = null;
        saveHistory(); saveProgram(); saveMeta(); Store.del(K.session);
        state.openLog = null; closeSheet(); setView('train');
        toast('Everything cleared');
      }, true);
      break;
    case 'confirm-yes': {
      var fn = scrimEl._onConfirm; scrimEl._onConfirm = null;
      if (fn) fn(); else closeSheet();
      break;
    }
    case 'confirm-no': scrimEl._onConfirm = null; closeSheet(); break;
  }
});

/* Enter / Space on the non-button rows in History. */
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Enter' && ev.key !== ' ') return;
  var el = ev.target.closest ? ev.target.closest('[role="button"]') : null;
  if (!el) return;
  ev.preventDefault();
  el.click();
});

/* ============================================================
   13. BOOT
   ============================================================ */
/* Imported or older data may be missing fields — repair before rendering. */
function normalizeHistory(list) {
  return (list || []).filter(function (w) { return w && Array.isArray(w.exercises); })
    .map(function (w) {
      w.id = w.id || uid();
      w.ts = w.ts || Date.now();
      w.date = w.date || dateKey(new Date(w.ts));
      w.day = typeof w.day === 'number' ? w.day : 0;
      w.title = w.title || (DEFAULT_PROGRAM[w.day] || DEFAULT_PROGRAM[0]).title;
      w.sentiment = w.sentiment || 'okay';
      w.exercises = w.exercises.map(function (e) {
        return { ex: e.ex, sets: Array.isArray(e.sets) ? e.sets : [] };
      });
      if (!w.totals) {
        var sets = 0, vol = 0;
        w.exercises.forEach(function (e) { e.sets.forEach(function (st) { sets++; vol += setVolume(st); }); });
        w.totals = { exercises: w.exercises.length, sets: sets, volume: Math.round(vol) };
      }
      return w;
    })
    .sort(function (a, b) { return a.ts - b.ts; });
}

state.history = normalizeHistory(state.history);

if (!Store.persistent) $('#storageBanner').hidden = false;
setView('train');

if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* fine — the app works without it */ });
  });
}
})();
